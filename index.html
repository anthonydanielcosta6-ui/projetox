<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>X Clone</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:white;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  min-height:100vh;
  border-left:1px solid #222;
  border-right:1px solid #222;
}

.header{
  padding:20px;
  font-size:30px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

.auth{
  padding:30px;
}

input, textarea{

  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:none;
  border-radius:12px;
  background:#16181c;
  color:white;
}

button{

  background:white;
  color:black;
  border:none;
  padding:12px 20px;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
}

.feed{
  display:none;
}

.post-box{
  padding:20px;
  border-bottom:1px solid #222;
}

.post{
  padding:20px;
  border-bottom:1px solid #222;
}

.username{
  font-weight:bold;
  margin-bottom:10px;
}

.actions{
  margin-top:15px;
  display:flex;
  gap:10px;
}

.comment{
  margin-top:10px;
  padding:10px;
  background:#111;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">X</div>

<div class="auth" id="auth">

<h2>Entrar</h2>

<input type="text" id="username" placeholder="Username">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Senha">

<button onclick="register()">Cadastrar</button>

<button onclick="login()">Entrar</button>

<div id="message"></div>

</div>

<div class="feed" id="feed">

<div class="post-box">

<textarea id="postText" placeholder="O que está acontecendo?"></textarea>

<button onclick="createPost()">Postar</button>

</div>

<div id="posts"></div>

</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwJSH9gNQ8lL8YPTAZ6kxAFC2Uf3Jdi4fYaY6Lx23MiztSQ0ZkRKr5ZG0CrKuNYNsXm/exec";

let currentUser = "";

async function api(data){

  const response = await fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"text/plain"
    },
    body:JSON.stringify(data)
  });

  return await response.json();
}

async function register(){

  const username =
    document.getElementById("username").value;

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const data = await api({
    action:"register",
    username,
    email,
    password
  });

  document.getElementById("message").innerText =
    data.success
    ? "Conta criada"
    : data.message;
}

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const data = await api({
    action:"login",
    email,
    password
  });

  if(data.success){

    currentUser = data.username;

    document.getElementById("auth").style.display =
      "none";

    document.getElementById("feed").style.display =
      "block";

    loadPosts();
  }
}

async function createPost(){

  const text =
    document.getElementById("postText").value;

  await api({
    action:"createPost",
    username:currentUser,
    text
  });

  document.getElementById("postText").value = "";

  loadPosts();
}

async function likePost(postId){

  await api({
    action:"likePost",
    postId
  });

  loadPosts();
}

async function commentPost(postId){

  const comment = prompt("Comentário:");

  if(!comment) return;

  await api({
    action:"commentPost",
    postId,
    username:currentUser,
    comment
  });

  loadPosts();
}

async function loadPosts(){

  const posts = await api({
    action:"getPosts"
  });

  const container =
    document.getElementById("posts");

  container.innerHTML = "";

  posts.forEach(post => {

    let commentsHTML = "";

    post.comments.forEach(comment => {

      commentsHTML += `
        <div class="comment">
          <strong>@${comment.username}</strong><br>
          ${comment.text}
        </div>
      `;
    });

    container.innerHTML += `
      <div class="post">

        <div class="username">
          @${post.username}
        </div>

        <div>
          ${post.text}
        </div>

        <div class="actions">

          <button onclick="likePost(${post.id})">
            Curtir (${post.likes})
          </button>

          <button onclick="commentPost(${post.id})">
            Comentar
          </button>

        </div>

        ${commentsHTML}

      </div>
    `;
  });
}

</script>

</body>
</html>
